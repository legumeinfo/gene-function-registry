    entity: TO:0000344
  - entity_name: negative regulation of short-day photoperiodism, flowering
    entity: GO:0048577
references:
  - citation: Weller, Vander Schoor et al., 2019
    doi: 10.1093/jxb/ery455
    pmid: 31222352

