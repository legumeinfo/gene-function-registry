comments:
  - PvTOC1 functions as a transcriptional repressor of its own promoter, with
    its CCT domain being essential for this repressive activity
  - Overexpression of PvTOC1 in bean protoplasts leads to decreased expression
    of clock-related genes such as PvLHY and PvELF4, indicating its role in
    suppressing morning and evening loop genes
  - PvTOC1's activity is influenced by chromatin modifications, as evidenced by
    its response to histone deacetylase inhibitor trichostatin A, which
    differentially affects clock gene expression
  - The PvTOC1 protein contains conserved domains, including the CCT domain,
    which is crucial for its repressive function, as demonstrated by
    domain-deletion experiments
phenotype_synopsis: PvTOC1 acts as a repressor within the circadian clock, with
  its overexpression resulting in suppressed expression of core clock genes;
  influencing the timing and rhythmicity of the plant's circadian functions
