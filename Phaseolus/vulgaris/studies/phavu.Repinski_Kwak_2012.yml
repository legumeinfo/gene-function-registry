comments:
  - PVTFL1 is a funtional homologue of Arabidopsis gene TFL1.
  - PvTFL1y co-segregates with the fin determinate growth habit phenotype loci.
  - Andean accessions contain with the fin phenotype have a 1.4kb retrotranposon
    insertion in exon 4 of the gene.
  - Mesoamerican accessions contain a substitution at a putative splice site at
    the end of exon 2.
  - The expression level of PvTFLy mRNA decreases significantly in plants with
    the determinate growth habit.
  - Wild type PvTFL1y gene transformed into Agrobacterium strain GV3101 and
    introduced into Arabidopsis tfl1-1 mutants (with determinate growth habit)
    resulted in restoration of the indeterminate growth in 17 out of 19 mutant
    plants.
  - In Arabidopsis, TFL1 represses AP1 and LFY to result in repression of floral
    initiation, maintaining the inflorescence meristem
  - Both mutations result in loss of function of the TFL1y gene.
  - Multiple GenBank accessions relate to this gene. The one used to determine
    the gene model was GenBank JN418230-BAT93-indeterminate control chosen as a
    core mapping population for the standard genotype. Others include GenBank
    JN418231-G12873-Indeterminate (wild type) mesoamerican accession;
    JN418250-Midas-Domesticated Andean accession (mutant);
    JN418248-CDRK-Determinate (mutant) accession of Andean Origin;
    JN418223-G00750-Determinate (mutant) accession of Mesoamerican Origin.
phenotype_synopsis: Wild type accessions have an indeterminate growth habit.
  Possessing either of the two mutant versions of TFLy results in a determinate
  growth habit.
