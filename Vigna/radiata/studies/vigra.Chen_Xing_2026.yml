comments:
  - VrPGIP1 contains a 136-bp promoter deletion that reduces its expression,
    which has been shown to enhance resistance to bruchid insects by inhibiting
    their digestive enzyme
  - Transcript analysis reveals that the deletion leads to altered expression
    patterns of VrPGIP1 during seed development and pest attack
  - The promoter deletion in VrPGIP1 results in increased
    polygalacturonase-inhibiting activity, conferring bruchid resistance in
    certain mung bean accessions
