comments:
  - Gene model full id was obtained by searching gene_model_pub_name in LIS gene
    search.
  - A series of insertions in multiple variants of the gene result in the
    premature termination of translation.
  - Flower color and hypocotyl color are linked traits in soybean and the gene
    is located in a strong LD block.
  - Accessions carrying the insertion overwelmingly had white flowers compared
    to reference-type accessions with purple flowers.
  - Anthocyanin content was signficantly higher in the purple-flowered plants
    than in white-flowered plants.
  - Transciptome analysis using published data showed reference-like GmW1
    expression was higher in purple flowered varieties.
  - Introduction of the reference GmW1 gene in white flowered Wm82 plants
    restored purple flower pigmentation and increased anthocyanin content.
phenotype_synopsis: Accessions with the mutant GmW1 gene result in white flower
  color and lower anthocyanin content.
