comments:
  - Gene model full id was obtained by searching gene_model_pub_name in LIS gene search.
  - A 2652 bp-deletion in this gene resulted in complete loss of function of the protein and was correlated with increased 100-seed weight, seed length, seed width, and seed thickness across wild soybeans, landraces, and cultivars.
  - The morphological effects are accomplished without significantly altering oil or protein content.
  - An ethyl methane sulfonate (EMS) induced Gmmate1 mutant displayed more vigorous growth than a Wm82 control at 7-week stage with larger leaves and pods, a prolonged growth period, and fewer pods per plant resulting in significantly larger pods and seeds with increases in seed length, width, thickness and 100-seed weeight.
