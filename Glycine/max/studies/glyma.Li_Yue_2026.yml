scientific_name: Glycine max
gene_symbols:
  - GmMATE1
gene_symbol_long: Multidrug and toxic compound extrusion transporter 1
gene_model_pub_name: SoyZH13_02G084000
gene_model_full_id: glyma.Zh13.gnm2.ann1.SoyZH13_02G084000
confidence: 3
curators:
  - Amy Pollpeter
comments:
  - Gene model full id was obtained by searching gene_model_pub_name in LIS gene
    search.
  - A 2652 bp-deletion in this gene resulted in complete loss of function of the
    protein and was correlated with increased 100-seed weight, seed length, seed
    width, and seed thickness across wild soybeans, landraces, and cultivars.
  - The morphological effects are accomplished without significantly altering
    oil or protein content.
  - An ethyl methane sulfonate (EMS) induced Gmmate1 mutant displayed more
    vigorous growth than a Wm82 control at 7-week stage with larger leaves and
    pods, a prolonged growth period, and fewer pods per plant resulting in
    significantly larger pods and seeds with increases in seed length, width,
    thickness and 100-seed weeight.
phenotype_synopsis: Accessions with the mutated GmMATE1 have increased 100-seed
  weight, associated with increased seed length, width and thickness.
