scientific_name: Glycine max
gene_symbols:
  - GmDREB5
gene_symbol_long: Dehydration-responsive Element Binder 5
gene_model_pub_name: Glyma.13G298600
gene_model_full_id: glyma.Wm82.gnm4.ann1.Glyma.13G298600
confidence: 4
curators:
  - Molly Hardacre
  - Scott Kalberer
comments:
  - GmDREB5 is a drought-induced DREB transcription factor in soybean that
    positively regulates drought tolerance.
  - Overexpression of GmDREB5 in soybean hairy roots increased drought
    tolerance, while its knockdown compromised tolerance.
  - GmDREB5 binds directly to dehydration-responsive element (DRE) motifs in
    promoters of stress-associated genes such as GmDHN.
  - The physical interaction of GmDREB5 with GmPLATZ17 reduces GmDREB5’s
    DNA-binding affinity, modulating the expression of stress genes.
  - Under drought stress, downregulation of GmPLATZ17 frees GmDREB5 to activate
    stress-responsive gene expression, improving drought tolerance.
phenotype_synopsis: GmDREB5 overexpression improves drought tolerance by
  activating stress-responsive genes, while its knockdown leads to reduced
  drought tolerance.
traits:
  - entity_name: drought tolerance
    entity: TO:0000276
  - entity_name: positive regulation of gene expression
    entity: GO:0010628
references:
