comments:
  - GmPLATZ17 is a soybean PLATZ transcription factor that is downregulated by
    drought and abscisic acid treatments.
  - Overexpression of GmPLATZ17 in Arabidopsis and soybean hairy roots led to
    increased drought sensitivity and suppression of stress-associated gene
    expression.
  - GmPLATZ17 protein localizes to the nucleus, supporting its role as a
    transcriptional regulator.
  - GmPLATZ17 interacts physically with the GmDREB5 transcription factor,
    interfering with its ability to bind DNA and activate stress-responsive
    genes.
  - Suppression of GmPLATZ17 enhances drought tolerance in soybean by allowing
    the activation of downstream stress response genes.
phenotype_synopsis: GmPLATZ17 overexpression causes increased drought
  sensitivity with inhibited stress gene expression, whereas its suppression
  enhances drought tolerance in soybean.
