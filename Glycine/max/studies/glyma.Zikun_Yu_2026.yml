scientific_name: Glycine max
gene_symbols:
  - GmCAD9L
gene_symbol_long: Cinnamyl alcohol dehydrogenase 9-related
gene_model_pub_name: Glyma.08G145900
gene_model_full_id: glyma.Wm82.gnm4.ann1.Glyma.08G145900
confidence: 5
curators:
  - Molly Hardacre
comments:
  - GmCAD9L is a downstream target gene of GmSRG16 and is positively involved in
    mediating cadmium tolerance in soybean
  - Overexpression of GmCAD9L enhances cadmium tolerance in soybean, resulting
    in improved resistance to heavy metal stress
  - GmCAD9L functions in the phenylpropanoid metabolic pathway, which is
    activated in GmSRG16 knockout plants leading to enhanced cadmium tolerance
  - GmCAD9L overexpression increases the accumulation of coniferin, a lignin
    precursor metabolite that chelates cadmium ions, which alleviates cadmium
    toxicity
phenotype_synopsis: Upregulation of GmCAD9L enhances cadmium tolerance in
  soybean by activating phenylpropanoid metabolism and promoting the
  accumulation of coniferin that chelates cadmium ions, which reduces toxicity
  and maintains root growth
