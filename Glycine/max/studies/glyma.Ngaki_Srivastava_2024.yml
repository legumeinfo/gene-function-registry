comments:
  - GmDR1 is an integral plasma membrane protein that confers broad-spectrum
    resistance against multiple pathogens and pests in soybean, including
    Fusarium virguliforme, Heterodera glycines, spider mites, and soybean aphids
  - Overexpression of GmDR1 enhances the expression of several receptor kinases,
    nucleotide-binding leucine-rich repeat proteins, and transcription factors
    related to plant immunity, suggesting its role as a pattern recognition
    receptor
  - GmDR1 is hypothesized to recognize pest-associated molecular patterns
    (PAMPs) such as chitin, thereby activating pattern-triggered immunity (PTI)
    and possibly priming effector-triggered immunity (ETI) pathways
  - Transcriptome analysis revealed that GmDR1 regulates hundreds of biotic
    stress-related genes, including those encoding receptor kinases and
    nucleotide-binding leucine-rich repeat receptor proteins, which are induced
    following chitin treatment and pathogen/insect infection
  - The gene_pub_name Glyma.10g094800 was taken from Ngaki, Sahoo et al., 2020.
