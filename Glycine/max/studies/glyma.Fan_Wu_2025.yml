comments:
  - Exogenous indole-3-acetic acid at low concentrations (1 μM) promotes GmSRS14
    expression, increases nodule number and nitrogenase activity, while abscisic
    acid treatments inhibit GmSRS14 expression, reduces nodule size, and
    decreases nitrogenase activity
  - GmSRS14 influences the expression of key nodulation and hormone-signaling
    genes such as GmENOD40 and GmYUC2a, indicating it may coordinate hormone
    pathways during nodule development
  - GmSRS14 is specifically expressed in soybean root nodules and localizes
    exclusively in the nucleus
  - Overexpression of GmSRS14 enhances nodule formation and nitrogen fixation,
    while silencing it suppresses nodulation
  - The gene_pub_name Glyma.13G197300 was taken from Zhao, Song et al., 2020
phenotype_synopsis: Overexpression of GmSRS14 results in increased root nodule
  number, weight, and nitrogenase activity whilst silencing GmSRS14 leads to
  reduced nodulation and nitrogen-fixing efficiency in soybean.
