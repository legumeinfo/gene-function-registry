comments:
  - GmPPC6 was identified as a staple gene by integrating genome-wide association study (GWAS) and comparative transcriptome analysis of soybean genotypes under low phosphorus stress
  - The functional annotation of GmPPC6 suggests its involvement in cellular responses to phosphate starvation
  - Polymorphisms, specifically InDels and SNPs in the promoter region of GmPPC6, were found to potentially influence the tolerance of soybean to low phosphorus stress
  - Overexpression of GmPPC6 in transgenic hairy roots significantly reduced root length and root surface area under low phosphorus conditions
  - RNA interference (RNAi) of GmPPC6 led to a significant increase in root length, root tips, root forks, and root surface area in hairy roots under low phosphorus treatment, indicating its negative regulatory role
phenotype_synopsis: Overexpression of the GmPPC6 gene negatively affects root length and root surface area under low phosphorus stress, while its suppression by RNA interference enhances these root traits, suggesting it negatively regulates root system development in soybean under such conditions.
