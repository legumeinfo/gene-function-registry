comments:
  - GmVOZ1G is one of six VOZ transcription factor-encoding genes found in the
    soybean genome, but prior to this study, little information was available
    regarding them.
  - The GmVOZ1G protein is primarily located in the nucleus, distinguishing its
    subcellular localization from other GmVOZ gene products like GmVOZ1E,
    GmVOZ2B, and GmVOZ2D, which are widely dispersed in the cytosol.
  - GmVOZ1G exhibits a significantly induced expression profile in response to
    dehydration, salt, and salicylic acid stress conditions, indicating its
    involvement in various stress responses.
  - Overexpression of GmVOZ1G in soybean hairy roots leads to greater tolerance
    to drought and salt stress, while its suppression through RNA interference
    results in increased sensitivity to these stresses.
  - Under drought and salt stress, overexpression of GmVOZ1G in soybean hairy
    roots improves physiological parameters such as higher relative water
    content, lower malondialdehyde accumulation, and increased peroxidase and
    superoxide dismutase activities, thereby positively regulating stress
    tolerance.
  - The Glyma.10G068900 gene model publication name may be found in
    Supplementary Table S2.
