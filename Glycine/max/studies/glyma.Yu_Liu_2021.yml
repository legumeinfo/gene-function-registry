gene_model_full_id: glyma.Wm82.gnm4.ann1.Glyma.01G097000
confidence: 4
curators:
  - Olivia Wall
comments:
  - An abscisic acid (ABA) receptor that binds ABA molecules to form an
    initiation complex
  - ABA-PYR1 complex inhibits PP2C proteins, allowing SnRK2 kinases to activate
    stress-response genes
  - Stress responses promote stomatal closure, reduce water loss, and increase
    production of protective proteins
  - Function determined through qPCR, overexpression, luciferase reporter
    assays, and protein phosphorylation experiments
  - GmPYR1 expression regulated by NF-Y transcription factor
phenotype_synopsis: overexpression leads to drought and salt tolerance,
  increased yield, fuller grains, and greater stem base circumference.
