comments:
  - ABA receptor binds ABA molecules to form an initiation complex
  - ABA-PYR1 complex inhibits PP2C proteins, allowing SnRK2 kinases to activate stress-response genes
  - These responses promote stomatal closure, reduce water loss, and increase production of protective proteins
  - Function determined through qPCR, overexpression, luciferase reporter assays, and protein phosphorylation experiments
