  - Scott Kalberer
comments:
  - Interacts with GmNSP1 to enhance transcriptional activity, with which it
    forms a heterodimer.
  - Works with GmNSP1 in the nodulation signaling pathway, regulating genes
    required for the soybean–rhizobia symbiosis.
  - Function determined through DNA pull down assays and BiFC assays.
  - No other name for this gene besides GmNSP2 was used in the publication Chen,
    Hu et al. (2023) or its supplementary material and no gene model was
    specified. Supplementary file "Data Sheet 1.pdf" of Hossain, Hoang et al.
    (2019) refers to GmNSP2 as gene model Glyma.04g43090. This gene model name
    was used to obtain the gene_model_full_id from LegumeInfo.org.
  - A gene search of NCBI for "GmNSP2" returned a result with locus tag
    "GLYMA_04G251900". A quest for this "GLYMA_04G251900" in LIS "Gene Search"
    revealed no results, but looking for "Glyma.04G251900" returned the result
    used for the gene_model_full_id with description "protein Scarecrow-like".
  - Searching the NCBI FASTA protein sequence (accession XP_003522584) in the
    LegumeInfo sequence search produced the same gene_model_full_id as the
    previous result.
phenotype_synopsis: Reduced root nodule formation when GmNSP2 function is knocked out.
