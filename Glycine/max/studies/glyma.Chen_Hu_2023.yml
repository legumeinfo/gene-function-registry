    (2023) for this gene. No gene model was specified in that publication or its
    supplementary material. A gene search of NCBI for "GmNSP1" returned a result
    with locus tag "GLYMA_07G039400". Review of this "GLYMA_07G039400" in LIS
    "Gene Search" revealed no results, but the hunt for "Glyma.07G039400"
    returned the result used for the gene_model_full_id with description
    "scarecrow-like transcription factor PAT1-like".
  - Searching the NCBI FASTA protein sequence (accession XP_003529836) in the
    LegumeInfo sequence search produced the same gene_model_full_id as a result.
