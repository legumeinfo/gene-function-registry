  - No other name for this gene besides GmENOD93 was used in the publication
    Chen, Hu et al. (2023) or its supplementary material and no gene model was
    specified. The gene_model_pub_name was determined by searching the GmENOD93
    FASTA protein sequence (Accession NP_001237669.1) in the LIS sequence search
    to attain the gene_model_pub_name and corresponding gene_model_full_id.*
  - Required for nodule formation in soybeans.
  - Directly binds to the promoter regions of early responsive genes, including
    nodule inception.
  - Forms a heterodimer with GmNSP2.
  - Function determined through DNA pull down assays and BiFC.
phenotype_synopsis: Inhibition of the gene by the BR signaling pathway results
  in decreased nodulation.
