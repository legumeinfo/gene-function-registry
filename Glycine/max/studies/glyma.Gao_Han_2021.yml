comments:
  - GmMYBA2 is classified as an R2R3 MYB transactivator with the KPRPR[S/T][F/L] motif, which is common for MYB activators associated with anthocyanin biosynthesis in eudicots.
  - This paper compares the Wm82 (w1T) and P3 (W1t) genotypes. Wm82 is characterized by likely loss of GmF3'5'H function due to a premature stop codon, while P3 is characterized by loss of GmF3'H function due to a frameshift mutation and protein truncation.
  - GmMYBA2 overexpression in Wm82 (w1T) and P3 (W1t) hairy roots tended to result in brown and purple colors respectively as opposed to the original yellow color.
  - GmMYBA2 affected anthocyanin accumulation in hairy roots with methylated delphinidin glycoside derivatives being prominent in P3 and cyanidin and pelargonidin derivatives being prominent in Wm82.
  - Overexpression of GmMYBA2 in the P3 (W1t) background resulted in purple coloration of the seed hilum and saddle, mimicking the imperfect black (W1/w1, i, R, t) phenotype, leading the authors to conclude that GmMYBA2 corresponds to the R locus.
  - Overexpression of GmMYBA2 in P3 increased anthocyanin content and resulted in intense purple coloration in the seed pod, flower, leaf, and the seed hilum and saddle.
  - Overexpression of GmMYBA2 increased the expression of GmTT8a and GmMYBR.
  - In P3, GmMYBA2 was found to bind the GmF3'5'H and GmUGT78K2 promoters.
  - GmMYBA2 was found to have protein-protein interaction with GmTT8a.
  - GmMYBA2, particularly when combined with GmTT8a, increased the expression of GmF3H, GmF3'5'H, GmDFR2, GmANS1/2, GmUGT78K1/2, and GmMYBR in P3 callus protoplasts.
  - GmMYBA2 forms a complex with GmTT8a that is inhibited by GmMYBR. GmMYBA2 activates the GmMYBR promoter to increase its expression, forming a feedback loop.
phenotype_synopsis: GmMYBA2 is a transcription factor whose overexpression tends to result in increased pigmentation in hairy roots, seed hila and saddles, leaves, and flowers through increased anthocyanin biosynthesis. This gene likely corresponds to the R locus, as it mimics the imperfect black phenotype in the W1 background.
