comments:
  - GmMYBR is an R2R3 transrepressor named in this study and distinguished from GmMYBR1 (Glyma.02G247100). It contains the C1, C2, and C5 domains, the latter two of which are characterized as powerful repressor domains in plants.
  - Overexpression of GmMYBR in P3 soybeans decreased anthocyanin content, induced pale flower color, and changed the hypocotyl color from purple to green. It also reduced the expression of anthocyanin biosynthesis genes.
  - GmMYBR was not found to directly bind to the GmF3'5'H promoter.
  - GmMYBR was found to have protein-protein interaction with GmTT8a.
  - GmMYBR represses the transcriptional regulatory activity of the GmMYBA2-GmTT8a complex on the GmF3'5'H promoter by interacting with GmTT8a.
  - GmMYBR was said to repress genes responsible for seed coat color, but a direct experiment was not performed to link GmMYBR transformation to lighter seed coat color.
  - GmMYBA2 forms a complex with GmTT8a that is inhibited by GmMYBR. GmMYBA2 activates the GmMYBR promoter to increase its expression, forming a feedback loop.
phenotype_synopsis: GmMYBR is a transcription factor that decreases pigmentation, at least in the flower and hypocotyl, by interacting with GmTT8a to inhibit the GmMYBA2-GmTT8a complex from activating anthocyanin biosynthesis genes.
