scientific_name: Glycine max
gene_symbols:
  - GmWRKY20
gene_symbol_long: WRKY20 family transcription factor
gene_model_pub_name: Glyma.08G021900
gene_model_full_id: glyma.Wm82.gnm4.ann1.Glyma.08G021900
confidence: 5
curators:
  - Amy Pollpeter
comments:
  - This gene was previously shown to improve drought tolerance when
    overexpressed in Arabidopsis, Medicago sativa, and soybean.
  - Loss of function (LOF) mutant plants showed higher susceptibility to drought
    stress, wilting sooner than wild type and not showing as much recovery when
    normal watering resumed.
  - LOF mutants showed higher concentrations of reactive oxygen species (ROS)
    after drought conditions than wild type plants; no differences between LOF
    mutants and wild type plants observed under normal watering control
    treatment.
  - Activities of peroxidase, superoxide dismutase, and catalase (anti-oxidant
    enzymes that funtion to remove ROS) were decreased in drought stressed LOF
    mutants relative to wild type plants; no difference between LOF mutants and
    wild type plants observed in normal watering control.
  - Malondialdehyde (MDA) content (a measure of membrane lipid peroxidation and
    cellular damage) was increased in LOF mutants under drought stress relative
    to wild type plants; no difference between mutants and wild types observed
    under normal watering control conditions.
  - Yellow fluorescent protein (YFP) assays showed co-localization of GmWRKY20
    and GmbZip9 in the nucleus.
  - GmWRKY20 protein binds to the W-box of the promoter sequence of GmANKTM21
    activating its expression.
  - Yeast mutants over expressing GmWRKY20 showed increased resistance to
    drought tolerance individually and synergestically with yeast mutants
    overexpressing GmbZip9.
  - Transgenic soybean hairy root assays showed increased drought tolerance in
    GmWRKY20 OE-mutants combined with GmbZip9 hairy roots relative to the empty
    vector hairy roots and GmWRKY20 LOF mutants combined with GmbZip9 OE-mutant
    hairy roots.
phenotype_synopsis: LOF mutants result in decreased drought tolerance; including
  increased ROS, decreased ROS removal enzymes, and increased indications of
  membrane peroxidation and cellular damage under drought conditions.
