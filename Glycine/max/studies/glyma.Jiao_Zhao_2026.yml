comments:
  - Expression of GmbZip9 increased in leaves at 0.5 hours and roots at 3 hours
    after drought stress.
  - Over-expression (OE) mutant plants showed less wilting and damage during
    drought stress than wild type plants; OE-mutants recovered faster with a
    more robust recovery when normal watering resumed.
  - OE-mutants showed lower concentrations of reactive oxygen species (ROS)
    after drought conditions than wild type plants; no differences between LOF
    mutants and wild type plants observed under normal watering control
    treatment.
  - Activities of peroxidase, superoxide dismutase, and catalase (antioxidant
    enzymes that funtion to remove ROS) were increased in drought stressed
    OE-mutants relative to wild type plants; no difference between LOF mutants
    and wild type plants observed in normal watering control.
  - Malondialdehyde (MDA) content (a measure of membrane lipid peroxidation and
    cellular damage) was decreased in OE-mutants under drought stress relative
    to wild type plants; no difference between mutants and wild types observed
    under normal watering control conditions.
  - Yellow fluorescent protein (YFP) assays showed co-localization of GmWRKY20
    and GmbZip9 in the nucleus.
  - GmbZip9 protein binds to the G-box of the promoter sequence of GmANKTM21
    activating its expression.
  - Yeast mutants over expressing GmbZip9 showed increased resistance to drought
    tolerance synergestically with yeast mutants overexpressing GmWRKY20.
  - Transgenic soybean hairy root assays showed increased drought tolerance in
    GmWRKY20 OE-mutants combined with GmbZip9 hairy roots relative to the empty
    vector hairy roots and GmWRKY20 LOF mutants combined with GmbZip9 OE-mutant
    hairy roots.
phenotype_synopsis: Over-expression of GmbZip9 increases drought tolerance and
  drought recovery; including decreasing the concentration of ROS and increasing
  the concentration of antioxidant enzymes in OE-mutants resulting in less
  membrane peroxidation and decreased measures of cellular damage.
