comments:
  - GmCXE31 is a member of the soybean CXE gene family that is highly expressed
    in seedling roots and responds to salt stress and strigolactones
  - GmCXE31 modulates lipid metabolism by transcriptionally regulating lipid
    biosynthesis-related genes, leading to higher seed oil content and an
    improved fatty acid profile in edited lines
  - Disruption of GmCXE31 results in increased nodule number, plant height, and
    seed yield, demonstrating its influence on agronomic traits
  - GMCXE31 negatively regulates salt tolerance in soybean, as its
    overexpression decreases salt tolerance while knockout enhances salt
    resilience in both soybean and Arabidopsis
  - GmCXE31 influences strigolactone homeostasis which controls multiple
    physiological pathways including antioxidant response, lipid synthesis, and
    symbiosis, contributing to enhanced stress tolerance and yield outcomes
phenotype_synopsis: Disruption of GmCXE31 via knockout enhances soybean salt
  tolerance, seed oil content, and overall plant growth, whereas its
  overexpression suppresses these traits
