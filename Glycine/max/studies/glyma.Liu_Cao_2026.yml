comments:
  - GmBI-1b is one of four Bax Inhibitor-1 (BI-1) genes identified in soybean
    and is significantly induced at both RNA and protein levels under drought
    stress, especially in leaves
  - The GmBI-1b protein localizes to the endoplasmic reticulum and contains a
    BI-1-like superfamily motif along with seven transmembrane domains
  - Overexpression of GmBI-1b in soybean enhances drought tolerance by reducing
    drought-induced cell death and maintaining higher leaf water and chlorophyll
    content
  - Transcriptomic analysis revealed that GmBI-1b upregulates abscisic acid
    signaling genes, cell death suppression genes, and aquaporin genes, which
    collectively contribute to improved drought resilience
  - BI-1 homologs, including OsBI-1 in rice and AtBI-1 in Arabidopsis, have been
    identified, and overexpression of these BI-1 genes suppresses Bax-mediated
    cell death in both yeast and Arabidopsis, demonstrating their conserved role
    in inhibiting programmed cell death
phenotype_synopsis: Overexpression of the GmBI-1b gene in soybean enhances
  drought tolerance by reducing cell death and maintaining higher leaf water
  content and chlorophyll levels without affecting plant growth
