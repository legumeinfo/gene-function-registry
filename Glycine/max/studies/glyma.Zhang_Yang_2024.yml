comments:
  - GmGLY1 encodes a cytochrome P450 family protein located on chromosome 11
    that is crucial for glycitein biosynthesis in soybean seeds
  - Overexpression of GmGLY1 in soybean hairy roots and seeds leads to increased
    glycitein content, while CRISPR/Cas9 knockout mutants show decreased
    glycitein and increased daidzein content
  - GmGLY1 likely catalyzes the hydroxylation of liquiritigenin or daidzein,
    acting similarly to known isoflavone hydroxylases within the phenylpropanoid
    pathway
  - Different GmGLY1 haplotypes significantly affect glycitein accumulation
    without notable differences in gene expression levels, suggesting variation
    in enzyme activity among alleles
  - GmGLY1 expression increases during seed development and in aging leaves,
    indicating roles in both isoflavone biosynthesis and potential plant immune
    responses.
phenotype_synopsis: GmGLY1 modulates soybean seed isoflavone profiles by
  promoting glycitein accumulation while inversely affecting daidzein levels,
  thereby influencing seed composition and potentially plant stress responses
