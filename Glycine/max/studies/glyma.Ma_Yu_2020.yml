comments:
  - Overexpression of GmNFYA5 enhances drought tolerance in both Arabidopsis and
    soybean by reducing water loss through stomatal regulation
  - Transgenic Arabidopsis lines with GmNFYA5 showed longer shoot and pod
    lengths, higher pod and seed numbers under drought stress, and maintained
    better growth than controls
  - GmNFYA5 upregulates drought-responsive genes in both abscisic acid-dependent
    (e.g., ABI2, ABI3, LEA3) and abscisic acid-independent pathways,
    contributing to improved stress resilience
  - GmNFYA5 directly binds to promoters of certain stress-related genes, such as
    GmDREB2 and GmbZIP1, activating their expression
  - GmNFYA5 was successfully overexpressed in Arabidopsis and soybean, resulting
    in enhanced drought tolerance compared to wild-type plants in both species
phenotype_synopsis: Overexpression of GmNFYA5 enhances drought tolerance in
  transgenic Arabidopsis and soybean plants
