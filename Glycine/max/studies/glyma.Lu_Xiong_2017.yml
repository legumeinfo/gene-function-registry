comments:
  - GmBZR1 interacts directly with the phosphatase PP2C-1, which facilitates its
    dephosphorylation and activation, thereby enhancing its function in seed
    development
  - Overexpression of GmBZR1 in transgenic plants results in increased seed size
    and seed weight, demonstrating its pivotal role in seed trait improvement
  - GmBZR1 forms complexes with other BZR family proteins and is localized
    mainly in the nucleus, indicating its function as a nuclear transcription
    regulator
phenotype_synopsis: GmBZR1 positively influences seed size and weight by
