gene_symbol_long: Phosphatase 2C-1
gene_model_pub_name: Glyma17g33690
gene_model_full_id: glyma.Wm82.gnm1.ann1.Glyma17g33690
confidence: 5
curators:
  - Molly Hardacre
comments:
  - The PP2C-1 allele derived from wild soybean (ZYD7) significantly enhances
    soybean 100-seed weight and size by promoting cell enlargement in the seed
    integument and activating seed trait-related genes
  - PP2C-1 interacts with GmBZR1 and facilitates the accumulation of its
    dephosphorylated, active form to promote seed growth
  - Overexpression of PP2C-1, but not the closely related PP2C-2 allele from
    cultivated soybean, leads to increased seed weight in transgenic plants,
    highlighting functional differences due to amino acid variations at the
    N-terminus
  - GmBZR1 overexpression independently enhances seed size and weight,
    supporting its central role in the brassinosteroid pathway regulated by
    PP2C-1
phenotype_synopsis: The PP2C-1 allele from soybean increases soybean 100-seed
  weight and seed size primarily by enlarging seed cell size, resulting in
  higher seed yield
