comments:
  - The GmANKTM21 gene encodes an ankyrin repeat protein belonging to the
    transmembrane domain (ANK-TM) subfamily, which is poorly understood despite
    being abundant in plants
  - GmANKTM21 is localized in both the cell membrane and nucleus of plant cells
  - Overexpression of GmANKTM21 in transgenic soybeans significantly enhances
    drought tolerance during germination and seedling stages. Additionally, it
    boosts the antioxidant capacity of soybeans by increasing the activity of
    enzymes like SOD, POD, and CAT, and reducing MDA content, thereby mitigating
    oxidative stress under drought conditions
  - GmANKTM21 improves drought resistance by enhancing the plant's water
    retention ability through the adjustment of stomatal aperture, rather than
    altering leaf cuticle or wax properties
  - The gene_model_pub_name was not found in the original paper, but obatined
    from in Jiao, Zhao et al., 2026
phenotype_synopsis: Overexpression of GmANKTM21 in transgenic soybeans leads to
  an enhanced drought-tolerant phenotype, characterized by increased water
  retention through stomatal closure and bolstered antioxidant defenses.
