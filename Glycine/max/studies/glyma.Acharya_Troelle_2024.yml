comments:
  - GmPGIP11 is a polygalacturonase inhibiting protein in soybean roots that is
    expressed during defense responses against the soybean cyst nematode,
    Heterodera glycines. PGIP11 inhibits pathogen-secreted polygalacturonases
    responsible for cell wall degradation.
  - Overexpression of GmPGIP11 in soybean roots leads to increased transcript
    abundance and significantly reduces Heterodera glycines parasitism without
    adversely affecting soybean root growth, whereas RNA interference knockdown
    of GmPGIP11 increases susceptibility to the nematode.
  - The expression of GmPGIP11 is modulated by components of both PAMP-triggered
    immunity and effector-triggered immunity signaling pathways.
  - GmPGIP11 belongs to a small gene family with distinct expression patterns,
    and unlike other PGIPs, it's specifically upregulated in syncytial nurse
    cells during the defense response to nematode infection.
  - PGIP family genes have been shown to play similar/important roles in plant
    defense (specifically nematode defense) across various species. For example,
    in Arabidopsis thaliana, AtPGIP1 increases in response to Heterodera
    schachtii invasion. The loss-of-function mutants are more susceptible,
    whereas overexpression of AtPGIP1 restores resistance.
phenotype_synopsis: GmPGIP11 functions as a defense-related gene in soybean
  roots, where its overexpression significantly reduces Heterodera glycines
  parasitism without affecting root growth, while its suppression via RNA
  interference increases susceptibility to the nematode.
