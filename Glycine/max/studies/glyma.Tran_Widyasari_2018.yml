comments:
  - Soybean mosaic virus (SMV) is a single-stranded positive-sense RNA virus
    that is destructive to soybean and SMV strains are classified by patterns of
    virulence. Resistance genes (R genes) include dominant NBS-LRR proteins that
    recognize pathogen avirulence factors. The four loci Rsv1, Rsv3, Rsv4, and
    Rsv5 confer strain-specific resistance.
  - Locus Rsv3 confers extreme resistance to the virulent SMV strains G5 to G7
    and was mapped on chromosome 14 in soybean genotype L29 (Jeong, Kristipati
    et al., 2002). Five NBS-LRR candidate genes for Rsv3 were identified in the
    154-kbp region between the two genetic markers A519F/R and M3Satt (Suh,
    Bowman et al., 2011).
  - Glyma.14g204700 exhibited the highest transcript abundance and
    genotype-phenotype correlation of the five candidates.
  - Glyma.14G204700 in assemblies 2 and 4 is the same as Glyma14g38533 in
    assembly 1.
  - Isolated and confirmed a locus, Glyma.14G204700, as full-length cDNA from
    soybean variety L29 that provides targeted resistance against SMV.
  - Overexpressing Glyma.14G204700 in susceptible soybeans inhibited SMV
    infection.
  - Transient silencing of Glyma.14G204700 in resistant L29 plants increased
    accumulation of the virus.
phenotype_synopsis: Glyma.14g204700 is a strong candidate for the Rsv3 gene
  responsible for strain-specific SMV resistance in soybean.
