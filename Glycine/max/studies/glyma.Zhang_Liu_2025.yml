comments:
  - GmFER1 is a soybean ferritin that enhances tolerance to salt stress and root
    rot disease, and improves soybean yield
  - Overexpression of GmFER1 leads to iron accumulation and Fe3+ sequestration
    in both aboveground and roots, activating the iron uptake and transport
    system
  - GmFER1 enhances salt stress resistance by improving the activities of SOD
    and CAT enzymes and Na+ efflux capacity, and boosts resistance to Fusarium
    infection by increasing antioxidant capacity
  - GmFER1 overexpression significantly upregulates genes involved in iron
    uptake and transport, such as GmbHLH300, GmbHLH57, GmIRT1, GmFRO2, and
    GmVIT1, in roots
  - Natural variations in the GmFER1 gene, specifically Hap2 haplotypes, can
    enhance salt resistance, disease resistance, pod number, and oil content in
    soybean, suggesting its potential for synergistic improvement of multiple
    traits
phenotype_synopsis: Overexpression of GmFER1 in soybeans leads to increased salt
  and Fusarium oxysporum root rot disease tolerance, enhanced iron accumulation,
  improved photosynthetic rates and Rubisco enzyme activity, and ultimately
  higher yields through increased pod number, seed weight, and branch number,
  all while minimizing growth penalties
