comments:
  - GmISO5 is identified as a key regulator of seed isoflavone biosynthesis in
    soybean, with natural variation at this locus influencing isoflavone content
  - CRISPR/Cas9-mediated knockout of GmISO5 results in approximately an 80%
    reduction in total seed isoflavones
  - GmISO5 directly binds to and activates promoters of GmHIDH and GmCHS1, key
    enzymes at various steps of the isoflavone biosynthetic pathway, indicating
    its role as a transcriptional activator
  - Loss of GmISO5 increases soybean susceptibility to soybean mosaic virus,
    linking its regulatory function not only to isoflavone biosynthesis but also
    to plant stress response mechanisms
  - The low-isoflavone haplotype of GmISO5 (GmISO5Low) has become highly
    prevalent in improved soybean cultivars, reaching a frequency of 91%,
    suggesting it has undergone strong positive selection during domestication
    and breeding
phenotype_synopsis: GmISO5 regulates isoflavone biosynthesis in soybean seeds,
  and its knockout leads to reduced seed isoflavone content and increased
  susceptibility to soybean mosaic virus infection
