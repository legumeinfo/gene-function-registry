comments:
  - Overexpression of GmIAA9 enhances root architecture by increasing total root
    length, surface area, and volume, thereby improving phosphorus uptake
    efficiency.
  - GmIAA9 promotes accumulation of auxin and abscisic acid, which are crucial
    hormones for root development and stress response modulation under
    phosphorus deficiency.
  - Transcriptome analysis shows GmIAA9 influences multiple pathways related to
    phenylpropanoid biosynthesis, cell cycle, and nuclear-cytoplasmic transport,
    facilitating adaptation to low phosphorus conditions.
  - While heterologous expression in tobacco demonstrates GmIAA9’s positive
    effect on growth and stress tolerance, its function in soybean requires
    further validation through homologous gene editing techniques.
phenotype_synopsis: Overexpression of GmIAA9 in tobacco results in enhanced root
  development, increased phosphorus acquisition, and improved tolerance to low
  phosphorus stress.
