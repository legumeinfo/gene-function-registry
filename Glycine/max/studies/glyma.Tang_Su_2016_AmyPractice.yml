comments: 
- GmCIF1 is an invertase inhibitor that showed a higher affinity for Cell wall invertases than vacuolar invertase.
- GMCIF1 had high homology (>40%) to AtCIF1.
- Treatment with ABA resulted in increased expression of both GmCIF1 and GmC/VIF2.
- Fluorescence studies showed that both GmCIF1 and GmC/VIF2 had extracellular targets.
- RNAi plants showed a prolonged plant greening period of approximately 4-6d.
- Suppression of GmCIF1 resulted in an increase of starch and protein in mature seeds.  Hexoses increased statistically, sucrose increased as well, but not significantly.
-
phenotype_synopsis: Suppression of GmCIF1 in RNAi plants increased seed weight, but did not show a statistical effect on germination rate. 
