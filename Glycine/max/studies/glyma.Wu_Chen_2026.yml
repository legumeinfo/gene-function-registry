comments:
  - GmTCP13 is a TCP transcription factor gene identified within a stable salt
    tolerance QTL region on chromosome 18, contributing to soybean's ability to
    withstand salt stress
  - GmTCP13 likely modulates water loss and stomatal behavior under salt stress,
    as silenced plants exhibit lower water retention and water content,
    indicating a role in water regulation mechanisms
  - A derived dCAPS marker based on a SNP in GmTCP13 allows for marker-assisted
    selection of salt-tolerant soybean lines, facilitating breeding programs
    aimed at improving salinity resilience
  - Variations in the GmTCP13 gene, particularly non-synonymous SNPs, are
    associated with enhanced salt tolerance, with the GmTCP13WH allele showing
    superior performance compared to GmTCP13PI
  - Functional assays demonstrated that overexpression of GmTCP13 increases salt
    tolerance in yeast, while silencing GmTCP13 in soybean reduces the plant's
    salt tolerance, confirming its regulatory role
phenotype_synopsis: GmTCP13 enhances soybean salt tolerance by maintaining
  higher relative water content and reducing leaf chlorosis under salt stress
  conditions, with the superior GmTCP13WH allele conferring greater resilience
  than the GmTCP13PI allele
