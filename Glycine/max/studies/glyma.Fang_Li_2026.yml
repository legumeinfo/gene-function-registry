comments:
  - GmDYT1a and GmDYT1c are two bHLH transcription factor genes in soybean that
    function redundantly to regulate pollen development and male fertility
  - Knockout of both GmDYT1a and GmDYT1c via CRISPR/Cas9 leads to complete male
    sterility characterized by microspore degeneration and absence of viable
    pollen, while single mutants remain fertile
  - GmDYT1a exhibits broad expression in multiple tissues including leaves and
    floral organs
phenotype_synopsis: The simultaneous knockout of the functionally redundant
  GmDYT1a and GmDYT1c genes in soybean results in complete male sterility
