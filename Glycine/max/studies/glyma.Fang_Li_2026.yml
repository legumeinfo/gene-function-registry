gene_model_full_id: glyma.Wm82.gnm4.ann1.Glyma.15G064000
confidence: 5
curators:
  - Molly Hardacre
comments:
  - Subcellular localization studies showed that GmDYT1a and GmDYT1c proteins
    have distinct cellular distributions suggesting possible functional
    divergence despite redundancy in male fertility regulation
  - Unlike GmDYT1a and GmDYT1c, GmDYT1b showed almost no detectable expression
    in floral tissues and its knockout had no effect on male fertility,
    indicating it does not regulate male sterility in soybean
  - The conserved DYT1–TDF1–AMS regulatory pathway involving GmDYT1a and GmDYT1c
    was confirmed in soybean, supporting their role as key upstream regulators
    of pollen development similar to other plant species
  - GmDYT1c expression is predominantly flower-specific at late anther
    developmental stages
phenotype_synopsis: The simultaneous knockout of the functionally redundant
  GmDYT1a and GmDYT1c genes in soybean results in complete male sterility
