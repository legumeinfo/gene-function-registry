comments:
  - GmIRT1.1 from soybean functions as a transporter involved in the uptake of
    iron, manganese, and cadmium ions.
  - Expression of GmIRT1.1 is primarily induced by iron deficiency and is
    predominantly localized in the roots.
  - Overexpression of GmIRT1.1 in Arabidopsis improves tolerance to iron
    deficiency by enhancing iron accumulation in roots and shoots.
  - GmIRT1.1 localizes to the plasma membrane, and its localization is regulated
    by the iron status of the plant, demonstrated in soybean hairy roots.
  - Transgenic lines of Arabidopsis overexpressing GmIRT1.1 exhibit increased
    sensitivity to manganese and cadmium toxicity.
phenotype_synopsis: GmIRT1.1 from soybean is a transporter that mediates uptake
  of iron, manganese, and cadmium, enhancing iron deficiency tolerance but
  increasing manganese and cadmium sensitivity when overexpressed in transgenic
  Arabidopsis.
