comments:
  - GsPRX9, a peroxidase gene from wild soybean, is induced by salt treatment
    with significantly higher relative expression levels in the roots of
    salt-tolerant soybean varieties compared to salt-sensitive varieties after
    NaCl treatment
  - Overexpression of GsPRX9 in yeast (strains INVSc1 and G19) enhanced their
    tolerance to both NaCl and H2O2 stress, demonstrating its role in stress
    response
  - In soybean, overexpression of GsPRX9 in composite plants resulted in higher
    shoot fresh weight and leaf relative water content after NaCl treatment
  - Overexpression of GsPRX9 in soybean hairy roots improved antioxidant
    responses under salt stress, leading to lower H2O2 content and higher
    activities of peroxidase and superoxide dismutase, as well as increased
    glutathione levels
phenotype_synopsis: Overexpression of the GsPRX9 gene confers enhanced salt
  tolerance in soybean by having a higher water content in leaves, better plant
  growth, and a better antioxidant response in both composite plants and hairy
  roots under salt stress conditions
