comments:
  - MsSPL9 silencing (SPL9-RNAi) in alfalfa leads to an increase in nodulation
    compared to wild-type plants
  - Transcript levels of MsSPL9 are negatively correlated with nodulation in
    alfalfa
  - MsSPL9 silencing prevents the inhibitory effect of nitrate on nodulation in
    alfalfa, while overexpression of MsSPL9 causes hypersensitivity to nitrate
    inhibition of nodulation
  - MsSPL9 regulates the transcription levels of nitrate-responsive genes (NR1,
    NR2, NRT2.5) and the shoot-controlled AON gene SUNN
  - MsSPL9 is involved in the regulation of root architecture in response to
    nitrate and rhizobia inoculation
phenotype_synopsis: MsSPL9 negatively regulates nodulation and influences root
  architecture in alfalfa, particularly in response to nitrate and rhizobia
  inoculation, with its silencing leading to enhanced nodulation and reduction
  of nitrate's inhibitory effect on nodule formation.
