comments:
  - MtRAV1’s promoter contains cis-elements responsive to light, stress, and
    hormones (e.g., ABRE for ABA), suggesting it integrates environmental and
    hormonal signals to regulate plant development
  - DNA affinity purification sequencing (DAP-seq) identified MtRAV1 binding
    motifs and target genes, including those involved in photosystem II and
    auxin response such as MtFd-l3, MtLhcb-l2, and MtSAUR-l
  - Transcriptomic analyses reveal MtRAV1 influences multiple pathways related
    to photosynthesis, circadian rhythm, and especially auxin signaling,
    indicating it controls complex growth regulatory networks
  - MtRAV1 represses the expression of flowering-related genes MtFTa1 and
    MtSOC1, as well as hormone biosynthesis genes MtGA3OX1, MtDWARF14, and
    MtCCD7, contributing to delayed flowering and altered growth
  - Overexpression of MtRAV1 in Medicago truncatula causes dwarfism, delayed
    flowering, reduced leaves and floral organs, increased branching, and
    smaller pods and seeds
phenotype_synopsis: Overexpression of the MtRAV1 gene in Medicago truncatula
  results in a dwarf, slow-growing plant with delayed flowering, smaller leaves
  and floral organs, increased primary branching, and reduced pod and seed size
  and number
