comments:
  - MtSMAX1 is a highly conserved ortholog in Medicago truncatula that functions
    as a negative regulator in the karrikin signaling pathway, interacting with
    the receptors MtKAI2a/b and MtMAX2
  - Mutations in MtSMAX1 lead to phenotypes such as reduced seed size, dwarfism,
    and delayed flowering, indicating its critical role in seed development and
    reproductive timing
  - The Q210 residue within MtSMAX1 contributes to its regulatory functions;
    mutations at this position partially impair seed pod development without
    significantly affecting plant height or flowering time
  - Overexpression of MtSMAX1 promotes increased plant height and earlier
    flowering, demonstrating its function as a positive regulator of plant
    growth and development
  - MtSMAX1 potentially modulates downstream genes involved in gibberellin
    biosynthesis and flowering pathways, linking karrikin signaling to key
    developmental processes
phenotype_synopsis: Loss of MtSMAX1 results in dwarfism, reduced seed size and
  number, delayed flowering, while overexpression promotes increased plant
  height and earlier flowering in Medicago truncatula
