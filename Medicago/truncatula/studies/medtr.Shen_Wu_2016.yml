comments:
  - MtJMJC5 is an ortholog of the Arabidopsis JMJ30/JMJD5 gene, encoding a
    Jumonji C domain-containing protein involved in circadian clock regulation
    in Medicago truncatula
  - MtJMJC5 expression oscillates with a circadian rhythm and is specifically
    regulated by cold stress through induction of alternative splicing events
    that generate multiple RNA isoforms
  - Four alternative splicing variants of MtJMJC5 were identified under cold
    treatment, including one full-length variant encoding the authentic protein
    and three premature termination codon containing variants resulting from
    alternative 3' splice sites
  - The PTC-containing splicing variants are targets of nonsense-mediated decay,
    but those variants sharing the 3' alternative splice site at the second
    intron show reduced sensitivity to nonsense-mediated decay under cold stress
    compared to variants with only first intron splicing
  - Cold-dependent alternative splicing of MtJMJC5 likely represents a
    species-specific mechanism linking circadian clock regulation and cold
    response, potentially influencing epigenetic regulation and cold-related
    developmental processes such as flowering time in Medicago truncatula
phenotype_synopsis: The MtJMJC5 gene, through its cold-induced alternative
  splicing and regulation of circadian rhythms, is implicated in modulating cold
  stress responses and may influence cold-related developmental processes such
  as flowering time in Medicago truncatula
