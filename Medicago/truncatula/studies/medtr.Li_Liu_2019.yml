comments:
  - MtCAS31 functions as a positive regulator of drought response by promoting
    autophagic degradation of specific proteins under stress conditions
  - MtCAS31 specifically interacts with the cargo protein MtPIP2;7, targeting it
    for autophagic degradation to reduce water loss in drought conditions
  - MtCAS31 localizes mainly to the endoplasmic reticulum and nucleus and acts
    as a cargo receptor in autophagy, extending dehydrins' functional roles in
    protein quality control during drought stress
  - During drought stress, MtCAS31 is highly induced, interacts with ATG8a via
    its AIM-like motif, and facilitates autophagic degradation pathways
  - Overexpression of MtCAS31 enhances drought tolerance by decreasing root
    hydraulic conductivity and water transpirations rates, indicating its role
    in water conservation
phenotype_synopsis: Knockout of MtCAS31 impairs drought tolerance, increases
  water loss, reduces survival rates, and heightens electrolyte leakage under
  drought stress conditions
