comments:
  - rs5825813 - Located on chromosome Ca4 within a locus associated with
    salinity tolerance under hydroponic and field conditions.
  - Identified via multi-trait genome-wide association analysis (mtGWAS).
  - Salinity stress was measured with a "stress tolerance rate" (STR) that
    ranged from 1 to 5.  Salinity resistant plants had an STR of less than 2.5.
  - STR was based on the percentage of healthy leaves the plant had during 4
    different scoring periods over a 2 week interval during the experiment.
  - Acknowledges relatively high LD, which may mean that this gene is not
    responsible for salinity tolerance, but in LD with one that is.
phenotype_synopsis: Associated with high salinity tolerance in chickpea
  genotypes grown in both hydroponic and field conditions.
