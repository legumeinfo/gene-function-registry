comments:
  - Australian breeders rely on the Ku dominant locus for breeding as it removes
    the requirement for a vernalization period.
  - LanFTc1 showed molecular and physiological concordance with plants
    exhibiting the Ku allele.
  - LanFTc1 expression dramatically increased in vernalization-responsive ku
    line (P27255) with vernalization
  - LanFTc1 expression of non-vernalized vernalization-insensitive Ku lines
    (83A:476) was  equivalent to the corresponding tissues of vernalized P27255
    plants and was not affected by vernalization.
  - Three acessions were used 83A:476 - Australian vernalization-insensitive
    line, P27255 - wild moroccan vernalization-responsive line, Sonet - Polish
    vernalization insensitive cultivar used for BAC library construction
phenotype_synopsis:
  - Vernalization in the vernalizataion-responsive (ku) accession - P27255
    increased LanFTc1 expression in shoot and leaves by 3600 fold and l74,000
    fold.
  - In the vernalization insensitive (Ku) plants (83A:476), the expression
    levels of LanFTc1 were similar in both vernalized and non-vernalized plants
    at levels similar to the vernalized plants of the vernalization-responsive
    line (P27255)
  - An indel in the putative promoter region of intron 3 is suggested as the
    causal polymorphism resulting in the Ku vernalization-insensitive phenoytpe,
    but this suggestion needs more experimentation for confirmation.
