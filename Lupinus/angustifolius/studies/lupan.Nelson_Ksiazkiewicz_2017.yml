comments:
  - Australian breeders rely on the Ku dominant locus for breeding as it removes the requirement for a vernalization period.
  - LanFTc1 showed molecular and physiological concordance with plants exhibiting the Ku allele.
  - LanFTc1 expression dramatically increased in vernalization-responsive ku line (P27255) with vernalization
  - LanFTc1 expression of non-vernalized vernalization-insensitive Ku lines (83A:476) was  equivalent to the corresponding tissues of vernalized P27255 plants and was not affected by vernalization.
  - Three acessions were used 83A:476 - Australian vernalization-insensitive line, P27255 - wild moroccan vernalization-responsive line, Sonet - Polish vernalization insensitive cultivar used for BAC library construction
