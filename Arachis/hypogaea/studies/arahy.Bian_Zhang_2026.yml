comments:
  - This is gene arahy.S245.gnm1.ann1.evm_chr16_3093.1, annotated as a
    probable glycosyltransferase isoform X4.
  - overexpression of an ortholog in rice significantly increased grain size
    by modulating cell proliferation and expansion.
  - An insertion–deletion within the promoter region of AhGSA1 was identified
    that results in a premature stop codon and loss of transmembrane and kinase domains.
  - Evidence includes GWAS, orthology analysis, subcellular localization analysis,
    and analysis of forty-two accessions classified as Hap1 (ATT type) and 293 accessions
    of Hap2 (AT type), with the Hap2 type showing significantly higher thousand-grain-weight.
phenotype_synopsis: AhGSA1, annotated as glycosyltransferase, is associated with seed size.
