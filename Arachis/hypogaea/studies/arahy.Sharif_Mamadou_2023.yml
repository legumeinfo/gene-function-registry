comments:
  - The AhAPY2-1p promoter is derived from the AhAPY2-1 gene, which is highly
    expressed specifically in the peanut pericarp, making it suitable for
    pod-specific gene expression
  - Functional validation of AhAPY2-1p in transgenic Arabidopsis showed that it
    effectively directs GUS gene expression predominantly in the pericarp
  - Cis-regulatory element analysis of AhAPY2-1p revealed the presence of
    hormone-responsive, light-responsive, wound-responsive, and defense-related
    elements, indicating its potential to regulate stress-related gene
    expression in the pericarp
phenotype_synopsis: The AhAPY2-1p promoter effectively drives tissue-specific
  gene expression in the peanut pericarp, as demonstrated by strong GUS activity
  in this tissue of transgenic Arabidopsis without significant expression in
  other organs
